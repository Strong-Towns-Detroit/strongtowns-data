name: Python

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra minutes
      - run: >-
          uv run ruff check
          src/strongtowns_data/repository.py
          src/strongtowns_data/base_units
          src/strongtowns_data/pois
          src/strongtowns_data/osm
          src/strongtowns_data/traveltime
          src/strongtowns_data/pipelines/snapshots.py
          tests/test_data_repository.py
          tests/test_data_models.py
          tests/test_krabby_*.py
      - run: uv run pytest -q tests/test_data_*.py tests/test_land_values.py tests/test_mapping.py tests/test_krabby_*.py tests/test_bza*.py tests/test_build_bza*.py tests/test_classify_bza*.py tests/test_enrich_bza*.py tests/test_normalize_bza*.py tests/test_recover_bza*.py tests/test_osm*.py
      - run: uv build
      - name: Smoke-test the built wheel
        run: |
          uv pip install --python .venv/bin/python --force-reinstall dist/*.whl
          .venv/bin/strongtowns-data --help

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra docs
      - run: uv run pdoc --output-directory build/docs strongtowns_data
      - uses: actions/upload-artifact@v4
        with:
          name: strongtowns-data-sdk-docs
          path: build/docs

  archive-restore-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra archive
      - name: Check whether the archive manifest has been published
        id: archive
        run: |
          if test -f scripts/data_archive_manifest.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Archive smoke skipped: no committed archive manifest yet."
          fi
      - name: Restore and verify immutable source tiers
        if: steps.archive.outputs.ready == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          uv run strongtowns-data archive pull --tier critical --tier source --apply
          uv run strongtowns-data archive status --tier critical --tier source
      - name: Rebuild core contracts without network access
        if: steps.archive.outputs.ready == 'true'
        run: |
          uv run strongtowns-data build canonical-detroit-parcels canonical-detroit-base-units-addresses canonical-detroit-base-units-streets canonical-detroit-base-units-buildings
          uv run strongtowns-data build detroit-routing-anchors
          uv run strongtowns-data build detroit-query-catalog
